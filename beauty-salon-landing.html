<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Салон красоты</title>
<meta name="description" content="Салон красоты: стрижки, окрашивание, маникюр, уход за лицом. Запись онлайн.">

<!-- Шрифты и иконки -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ============ ПЕРЕМЕННЫЕ ДИЗАЙН-СИСТЕМЫ ============ */
:root {
  --cream: #faf6ef;
  --beige: #efe6d8;
  --sand: #d9c7ad;
  --coffee: #6b4f3a;
  --graphite: #2b2724;
  --muted: #7a6f66;
  --white: #fffdf9;
  --shadow: 0 10px 30px rgba(43, 39, 36, .08);
  --shadow-lg: 0 18px 45px rgba(43, 39, 36, .16);
  --radius: 4px;
  --header-h: 76px;
  --font-head: 'Playfair Display', Georgia, serif;
  --font-body: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
}

/* ============ БАЗА ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
body {
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.7;
  color: var(--graphite);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; transition: all .3s ease; }
ul { list-style: none; }
.container { width: min(1160px, 100% - 48px); margin-inline: auto; }
section { padding: 100px 0; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; line-height: 1.2; letter-spacing: .01em; }
h2 { font-size: clamp(2rem, 4vw, 2.9rem); }
.section-head { max-width: 560px; margin-bottom: 56px; }
.section-head p { margin-top: 14px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--coffee); outline-offset: 3px; }

/* ============ КНОПКИ ============ */
.btn {
  display: inline-block;
  padding: 14px 32px;
  font: 500 .85rem var(--font-body);
  letter-spacing: .08em;
  border: 1px solid var(--graphite);
  background: var(--graphite);
  color: var(--cream);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all .3s ease;
}
.btn:hover { background: var(--coffee); border-color: var(--coffee); transform: translateY(-2px); box-shadow: var(--shadow); }
.btn--ghost { background: transparent; color: var(--graphite); }
.btn--ghost:hover { color: var(--cream); }
.btn--light { background: var(--cream); color: var(--graphite); border-color: var(--cream); }
.btn--light:hover { background: var(--beige); border-color: var(--beige); }

/* ============ HEADER ============ */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  height: var(--header-h);
  display: flex; align-items: center;
  transition: all .3s ease;
}
.header.scrolled { background: rgba(250, 246, 239, .94); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(43, 39, 36, .07); }
.header .container { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { font-family: var(--font-head); font-size: 1.5rem; letter-spacing: .04em; color: var(--cream); }
.header.scrolled .logo { color: var(--graphite); }
.nav ul { display: flex; gap: 36px; }
.nav a { font-size: .85rem; font-weight: 400; letter-spacing: .06em; color: var(--cream); position: relative; padding: 4px 0; }
.header.scrolled .nav a { color: var(--graphite); }
.nav a::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 1px; background: currentColor; transition: all .3s ease; }
.nav a:hover::after { width: 100%; }
.header .btn { padding: 10px 24px; background: var(--cream); color: var(--graphite); border-color: var(--cream); }
.header.scrolled .btn { background: var(--graphite); color: var(--cream); border-color: var(--graphite); }
.header .btn:hover { background: var(--coffee); border-color: var(--coffee); color: var(--cream); }
.burger { display: none; width: 44px; height: 44px; background: none; border: 0; cursor: pointer; position: relative; }
.burger span, .burger span::before, .burger span::after {
  content: ""; position: absolute; left: 10px; width: 24px; height: 2px; background: var(--cream); transition: all .3s ease;
}
.burger span { top: 21px; }
.burger span::before { left: 0; top: -7px; }
.burger span::after { left: 0; top: 7px; }
.header.scrolled .burger span, .header.scrolled .burger span::before, .header.scrolled .burger span::after,
.header.menu-open .burger span, .header.menu-open .burger span::before, .header.menu-open .burger span::after { background: var(--graphite); }
.header.menu-open .burger span { background: transparent; }
.header.menu-open .burger span::before { top: 0; transform: rotate(45deg); }
.header.menu-open .burger span::after { top: 0; transform: rotate(-45deg); }

/* ============ HERO ============ */
.hero {
  min-height: 100vh; min-height: 100svh;
  display: flex; align-items: center;
  padding: calc(var(--header-h) + 40px) 0 80px;
  color: var(--cream);
  background-size: cover; background-position: center;
  background-color: var(--graphite);
  position: relative;
}
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(43,39,36,.82) 10%, rgba(43,39,36,.35) 70%); }
.hero .container { position: relative; }
.hero h1 { font-size: clamp(2.6rem, 6.5vw, 5rem); max-width: 14ch; }
.hero p { margin: 26px 0 40px; max-width: 46ch; font-size: 1.05rem; color: var(--beige); }
.hero__actions { display: flex; flex-wrap: wrap; gap: 16px; }
.hero .btn--ghost { color: var(--cream); border-color: var(--cream); }
.hero .btn--ghost:hover { background: var(--cream); color: var(--graphite); border-color: var(--cream); }

/* ============ SERVICES ============ */
.services { background: var(--cream); }
.services__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: all .3s ease; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.card__img { aspect-ratio: 4 / 3; overflow: hidden; background: var(--beige); }
.card__img img { width: 100%; height: 100%; object-fit: cover; transition: all .6s ease; }
.card:hover .card__img img { transform: scale(1.05); }
.card__body { padding: 28px; display: flex; flex-direction: column; flex: 1; }
.card__body h3 { font-size: 1.4rem; }
.card__body p { margin: 10px 0 22px; color: var(--muted); font-size: .92rem; flex: 1; }
.card__price { font-family: var(--font-head); font-size: 1.3rem; color: var(--coffee); padding-top: 18px; border-top: 1px solid var(--beige); }

/* ============ ABOUT ============ */
.about { background: var(--beige); }
.about__grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 72px; align-items: start; }
.about__text p { margin-top: 18px; color: var(--muted); }
.features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
.feature { background: var(--cream); padding: 32px 28px; border-radius: var(--radius); transition: all .3s ease; }
.feature:hover { box-shadow: var(--shadow); transform: translateY(-4px); }
.feature i { font-size: 1.5rem; color: var(--coffee); margin-bottom: 18px; }
.feature h3 { font-size: 1.15rem; margin-bottom: 8px; }
.feature p { font-size: .9rem; color: var(--muted); }

/* ============ GALLERY ============ */
.gallery__grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 280px; gap: 16px; }
.gallery__item { overflow: hidden; border-radius: var(--radius); background: var(--beige); }
.gallery__item:nth-child(1), .gallery__item:nth-child(4) { grid-row: span 2; }
.gallery__item img { width: 100%; height: 100%; object-fit: cover; transition: all .6s ease; }
.gallery__item:hover img { transform: scale(1.06); }

/* ============ CTA-ПОЛОСА ============ */
.cta { background: var(--graphite); color: var(--cream); text-align: center; padding: 80px 0; }
.cta p { margin: 14px auto 32px; max-width: 48ch; color: var(--sand); }

/* ============ FOOTER ============ */
.footer { background: #231f1c; color: var(--sand); padding: 80px 0 28px; }
.footer__grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 48px; }
.footer h3 { color: var(--cream); font-size: 1.2rem; margin-bottom: 20px; }
.footer li { margin-bottom: 12px; font-size: .92rem; display: flex; gap: 12px; align-items: baseline; }
.footer li i { width: 16px; color: var(--coffee); filter: brightness(1.6); }
.footer a:hover { color: var(--cream); }
.footer__logo { font-family: var(--font-head); font-size: 1.6rem; color: var(--cream); margin-bottom: 14px; }
.footer__about { font-size: .92rem; max-width: 34ch; }
.socials { display: flex; gap: 12px; margin-top: 24px; }
.socials a { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #4a423b; border-radius: 50%; }
.socials a:hover { background: var(--cream); color: var(--graphite); border-color: var(--cream); transform: translateY(-3px); }
.footer__bottom { margin-top: 56px; padding-top: 24px; border-top: 1px solid #3a332e; font-size: .8rem; text-align: center; }

/* ============ АДАПТИВНОСТЬ ============ */
@media (max-width: 1024px) {
  .services__grid { grid-template-columns: repeat(2, 1fr); }
  .about__grid { grid-template-columns: 1fr; gap: 48px; }
  .footer__grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .burger { display: block; }
  .header .btn { display: none; }
  .header.menu-open { background: var(--cream); }
  .header.menu-open .logo { color: var(--graphite); }
  .nav { position: fixed; top: var(--header-h); left: 0; right: 0; background: var(--cream); padding: 12px 24px 32px; box-shadow: var(--shadow); transform: translateY(-120%); opacity: 0; visibility: hidden; transition: all .3s ease; }
  .header.menu-open .nav { transform: none; opacity: 1; visibility: visible; }
  .nav ul { flex-direction: column; gap: 0; }
  .nav a { display: block; padding: 16px 0; color: var(--graphite); border-bottom: 1px solid var(--beige); }
  .nav .nav__cta { display: block; margin-top: 20px; }
}
@media (min-width: 861px) { .nav .nav__cta { display: none; } }
@media (max-width: 640px) {
  section { padding: 72px 0; }
  .services__grid, .features, .footer__grid { grid-template-columns: 1fr; }
  .gallery__grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; gap: 10px; }
  .gallery__item:nth-child(1), .gallery__item:nth-child(4) { grid-row: auto; }
  .hero__actions .btn { width: 100%; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<body>

<!-- ============ HEADER ============ -->
<header class="header" id="header">
  <div class="container">
    <a href="#top" class="logo" data-bind="salon.name"></a>
    <nav class="nav" id="nav" aria-label="Основная навигация">
      <ul>
        <li><a href="#services">Услуги</a></li>
        <li><a href="#about">О нас</a></li>
        <li><a href="#gallery">Галерея</a></li>
        <li><a href="#contacts">Контакты</a></li>
        <li><a href="#contacts" class="btn nav__cta" data-bind="texts.bookButton"></a></li>
      </ul>
    </nav>
    <a href="#contacts" class="btn" data-bind="texts.bookButton"></a>
    <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false"><span></span></button>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero" id="hero">
    <div class="container">
      <h1 data-bind="hero.title"></h1>
      <p data-bind="hero.subtitle"></p>
      <div class="hero__actions">
        <a href="#contacts" class="btn btn--light" data-bind="hero.buttonText"></a>
        <a href="#services" class="btn btn--ghost" data-bind="hero.secondaryButtonText"></a>
      </div>
    </div>
  </section>

  <!-- ============ УСЛУГИ ============ -->
  <section class="services" id="services">
    <div class="container">
      <div class="section-head">
        <h2 data-bind="services.title"></h2>
        <p data-bind="services.subtitle"></p>
      </div>
      <div class="services__grid" id="servicesGrid"></div>
    </div>
  </section>

  <!-- ============ О НАС ============ -->
  <section class="about" id="about">
    <div class="container about__grid">
      <div class="about__text">
        <h2 data-bind="about.title"></h2>
        <p data-bind="about.text"></p>
      </div>
      <div class="features" id="featuresGrid"></div>
    </div>
  </section>

  <!-- ============ ГАЛЕРЕЯ ============ -->
  <section class="gallery" id="gallery">
    <div class="container">
      <div class="section-head">
        <h2 data-bind="gallery.title"></h2>
        <p data-bind="gallery.subtitle"></p>
      </div>
      <div class="gallery__grid" id="galleryGrid"></div>
    </div>
  </section>

  <!-- ============ ПРИЗЫВ К ДЕЙСТВИЮ ============ -->
  <section class="cta">
    <div class="container">
      <h2 data-bind="cta.title"></h2>
      <p data-bind="cta.text"></p>
      <a href="#" class="btn btn--light" id="ctaButton" data-bind="cta.buttonText"></a>
    </div>
  </section>
</main>

<!-- ============ FOOTER / КОНТАКТЫ ============ -->
<footer class="footer" id="contacts">
  <div class="container">
    <div class="footer__grid">
      <div>
        <div class="footer__logo" data-bind="salon.name"></div>
        <p class="footer__about" data-bind="footer.about"></p>
        <div class="socials" id="socials"></div>
      </div>
      <div>
        <h3>Контакты</h3>
        <ul>
          <li><i class="fa-solid fa-phone"></i><a href="#" id="phoneLink"></a></li>
          <li><i class="fa-solid fa-location-dot"></i><span data-bind="contacts.address"></span></li>
          <li><i class="fa-brands fa-instagram"></i><a href="#" id="instaLink" target="_blank" rel="noopener"></a></li>
        </ul>
      </div>
      <div>
        <h3>Часы работы</h3>
        <ul id="hoursList"></ul>
      </div>
    </div>
    <div class="footer__bottom" id="copyright"></div>
  </div>
</footer>

<script>
/* =====================================================================
   КОНФИГУРАЦИЯ САЙТА
   Весь изменяемый контент хранится ТОЛЬКО здесь.
   Структура и стили ниже менять не нужно.
   ===================================================================== */
const SITE_DATA = {
  /* --- Основная информация --- */
  salon: {
    name: "Maison Belle",
    pageTitle: "Maison Belle — салон красоты в центре города"
  },

  /* --- Контакты --- */
  contacts: {
    phone: "+7 (495) 123-45-67",
    address: "Москва, ул. Тверская, 12, студия 3",
    instagram: "maisonbelle.studio",           // без @
    hours: [
      { days: "Пн – Пт", time: "10:00 – 21:00" },
      { days: "Суббота", time: "10:00 – 20:00" },
      { days: "Воскресенье", time: "11:00 – 18:00" }
    ],
    socials: [                                  // иконки FontAwesome: fa-brands fa-...
      { icon: "fa-brands fa-instagram", url: "https://instagram.com/" },
      { icon: "fa-brands fa-telegram", url: "https://t.me/" },
      { icon: "fa-brands fa-whatsapp", url: "https://wa.me/" }
    ]
  },

  /* --- Тексты и баннеры --- */
  texts: { bookButton: "Записаться" },

  hero: {
    title: "Красота, которая говорит тихо",
    subtitle: "Авторские стрижки, уход за кожей и ногтями в спокойной атмосфере. Мы подбираем образ, который остаётся с вами надолго.",
    buttonText: "Записаться на визит",
    secondaryButtonText: "Смотреть услуги",
    image: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1800&q=80"
  },

  services: {
    title: "Услуги и цены",
    subtitle: "Прозрачные цены без скрытых доплат. Точную стоимость мастер назовёт после консультации.",
    items: [
      { name: "Стрижка и укладка", description: "Индивидуальный подбор формы по типу волос и образу жизни.", price: "от 3 500 ₽", image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80" },
      { name: "Окрашивание", description: "Сложные техники и бережные составы: от тонирования до airtouch.", price: "от 7 000 ₽", image: "https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=800&q=80" },
      { name: "Маникюр и педикюр", description: "Аппаратный и классический уход, стойкое покрытие, дизайн.", price: "от 2 200 ₽", image: "https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=800&q=80" },
      { name: "Уход за лицом", description: "Чистка, пилинги и увлажнение с подбором косметики по типу кожи.", price: "от 4 500 ₽", image: "https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=800&q=80" },
      { name: "Макияж", description: "Дневной, вечерний и свадебный макияж на профессиональной косметике.", price: "от 4 000 ₽", image: "https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?auto=format&fit=crop&w=800&q=80" },
      { name: "Брови и ресницы", description: "Архитектура бровей, ламинирование, наращивание ресниц.", price: "от 2 000 ₽", image: "https://images.unsplash.com/photo-1583001931096-959e9a1a6223?auto=format&fit=crop&w=800&q=80" }
    ]
  },

  about: {
    title: "Почему выбирают нас",
    text: "Мы создали пространство, где не нужно спешить. Каждый визит начинается с разговора, а заканчивается результатом, которым вы довольны.",
    features: [                                  // иконки FontAwesome
      { icon: "fa-solid fa-user-check", title: "Опытные мастера", text: "Средний стаж команды — более 8 лет." },
      { icon: "fa-solid fa-leaf", title: "Бережные продукты", text: "Профессиональная косметика премиум-класса." },
      { icon: "fa-solid fa-spa", title: "Спокойная атмосфера", text: "Тишина, чай и никакой очереди." },
      { icon: "fa-solid fa-shield-heart", title: "Стерильность", text: "Одноразовые расходники и контроль инструментов." }
    ]
  },

  gallery: {
    title: "Наши работы",
    subtitle: "Несколько образов, созданных в нашем салоне.",
    images: [
      "https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1633681926022-84c23e8cb2d6?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1470259078422-826894b933aa?auto=format&fit=crop&w=900&q=80"
    ]
  },

  cta: {
    title: "Подарите себе время",
    text: "Выберите удобный день, и мы подберём мастера и процедуру под ваш запрос.",
    buttonText: "Записаться по телефону"
  },

  footer: {
    about: "Салон красоты в центре города. Работаем для тех, кто ценит качество и спокойствие.",
    copyright: "Все права защищены."
  }
};

/* =====================================================================
   ОТРИСОВКА КОНТЕНТА ИЗ SITE_DATA
   ===================================================================== */
(function () {
  const D = SITE_DATA;

  /* Достаём значение по пути вида "hero.title" */
  const get = (path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), D);

  /* Создаёт элемент с классом и текстом (textContent — безопасно) */
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  /* Если фото не загрузилось — оставляем мягкую бежевую заливку */
  const safeImg = (src, alt) => {
    const img = el('img');
    img.src = src; img.alt = alt || ''; img.loading = 'lazy';
    img.onerror = () => { img.style.visibility = 'hidden'; };
    return img;
  };

  /* 1. Простые текстовые подстановки: <div data-bind="hero.title"> */
  document.querySelectorAll('[data-bind]').forEach((n) => {
    const v = get(n.dataset.bind);
    if (v !== undefined) n.textContent = v;
  });
  document.title = D.salon.pageTitle;

  /* 2. Hero-фон */
  document.getElementById('hero').style.backgroundImage = `url("${D.hero.image}")`;

  /* 3. Карточки услуг */
  const sg = document.getElementById('servicesGrid');
  D.services.items.forEach((s) => {
    const card = el('article', 'card');
    const imgWrap = el('div', 'card__img');
    imgWrap.appendChild(safeImg(s.image, s.name));
    const body = el('div', 'card__body');
    body.append(el('h3', '', s.name), el('p', '', s.description), el('div', 'card__price', s.price));
    card.append(imgWrap, body);
    sg.appendChild(card);
  });

  /* 4. Преимущества */
  const fg = document.getElementById('featuresGrid');
  D.about.features.forEach((f) => {
    const box = el('div', 'feature');
    const icon = el('i', f.icon);
    box.append(icon, el('h3', '', f.title), el('p', '', f.text));
    fg.appendChild(box);
  });

  /* 5. Галерея */
  const gg = document.getElementById('galleryGrid');
  D.gallery.images.forEach((src, i) => {
    const item = el('div', 'gallery__item');
    item.appendChild(safeImg(src, 'Работа салона ' + (i + 1)));
    gg.appendChild(item);
  });

  /* 6. Контакты, часы работы, соцсети */
  const tel = D.contacts.phone.replace(/[^\d+]/g, '');
  const phone = document.getElementById('phoneLink');
  phone.textContent = D.contacts.phone; phone.href = 'tel:' + tel;
  document.getElementById('ctaButton').href = 'tel:' + tel;

  const insta = document.getElementById('instaLink');
  insta.textContent = '@' + D.contacts.instagram;
  insta.href = 'https://instagram.com/' + D.contacts.instagram;

  const hl = document.getElementById('hoursList');
  D.contacts.hours.forEach((h) => {
    const li = el('li');
    li.append(el('span', '', h.days + ':'), el('span', '', h.time));
    hl.appendChild(li);
  });

  const so = document.getElementById('socials');
  D.contacts.socials.forEach((s) => {
    const a = el('a'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', s.icon.split('fa-').pop());
    a.appendChild(el('i', s.icon));
    so.appendChild(a);
  });

  document.getElementById('copyright').textContent =
    '© ' + new Date().getFullYear() + ' ' + D.salon.name + '. ' + D.footer.copyright;

  /* =================================================================
     ПОВЕДЕНИЕ: sticky-шапка и мобильное меню
     ================================================================= */
  const header = document.getElementById('header');
  const burger = document.getElementById('burger');

  const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 40);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const setMenu = (open) => {
    header.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
  };
  burger.addEventListener('click', () => setMenu(!header.classList.contains('menu-open')));
  document.querySelectorAll('#nav a').forEach((a) => a.addEventListener('click', () => setMenu(false)));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
  window.addEventListener('resize', () => { if (window.innerWidth > 860) setMenu(false); });
})();
</script>
</body>
</html>
